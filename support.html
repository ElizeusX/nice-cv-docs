<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - Nice CV - Resume Maker AI</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  h1 { font-size: 1.6em; margin-bottom: 0.2em; }
  p.tagline { color: #666; margin-top: 0; }
  label { display: block; margin-top: 18px; font-weight: 500; font-size: 0.95em; }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1em;
    box-sizing: border-box;
  }
  textarea { min-height: 140px; resize: vertical; }
  button {
    margin-top: 24px;
    padding: 12px 28px;
    background: #0066cc;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1em;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #0052a3; }
  .direct-email { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; color: #555; font-size: 0.95em; }
  a { color: #0066cc; }
  nav { margin-bottom: 30px; }
  nav a { margin-right: 16px; text-decoration: none; color: #0066cc; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="privacy.html">Privacy Policy</a>
  <a href="terms.html">Terms of Use</a>
</nav>

<h1>Support</h1>
<p class="tagline">Have a question or ran into an issue? Send us a message below.</p>

<form id="support-form">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="subject">Subject</label>
  <input type="text" id="subject" name="subject" placeholder="e.g. Bug report, question, feedback" required>

  <label for="body">Message</label>
  <textarea id="body" name="body" placeholder="Describe your question or issue..." required></textarea>

  <button type="submit">Send via Email</button>
</form>

<script>
  document.getElementById('support-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value;
    var subject = document.getElementById('subject').value;
    var body = document.getElementById('body').value;
    var fullBody = 'From: ' + name + '\n\n' + body;
    var mailto = 'mailto:nice.cv.support@gmail.com'
      + '?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(fullBody);
    window.location.href = mailto;
  });
</script>

<div class="direct-email">
  Prefer to email directly? Reach us at
  <a href="mailto:nice.cv.support@gmail.com">nice.cv.support@gmail.com</a>
</div>

</body>
</html>
